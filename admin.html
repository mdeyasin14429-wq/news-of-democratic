<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — News of Democratic</title><link rel="stylesheet" href="style.css"></head><body><header><div class="top"><div class="logo"><span>ND</span><b>NEWS OF <i>DEMOCRATIC</i></b></div><div class="tag">ADMIN PANEL</div></div></header><main class="admin"><div id="login" class="panel"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><p id="msg"></p></div><div id="app" class="hidden"><div class="panel userbar"><b>Admin Panel</b><button onclick="logout()">Logout</button></div><div class="panel"><h2>নতুন খবর প্রকাশ করুন</h2><input id="title" placeholder="খবরের শিরোনাম"><select id="category"><option>নরসিংদী</option><option>সদর</option><option>রায়পুরা</option><option>পলাশ</option><option>শিবপুর</option><option>মনোহরদী</option><option>বেলাব</option><option>শিক্ষা</option><option>খেলাধুলা</option></select><input id="upazila" placeholder="উপজেলা (ঐচ্ছিক)"><input id="image" placeholder="ছবির URL (ঐচ্ছিক)"><textarea id="content" rows="9" placeholder="বিস্তারিত খবর"></textarea><label><input id="published" type="checkbox"> এখনই Publish</label><br><button onclick="saveNews()">Save / Publish</button><p id="saveMsg"></p></div><div class="panel"><h2>প্রকাশিত/সংরক্ষিত খবর</h2><div id="list"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function doLogin(){let{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}check()}async function check(){let{data:{user}}=await sb.auth.getUser();if(!user)return;let{data:a}=await sb.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();if(!a){await sb.auth.signOut();msg.textContent="এই account-এর Admin permission নেই।";return}login.classList.add("hidden");app.classList.remove("hidden");load()}async function logout(){await sb.auth.signOut();location.reload()}async function saveNews(){let{data:{user}}=await sb.auth.getUser();let row={title:title.value.trim(),content:content.value.trim(),category:category.value,upazila:upazila.value.trim()||null,image_url:image.value.trim()||null,author:user.email,published:published.checked};if(!row.title||!row.content){saveMsg.textContent="শিরোনাম ও বিস্তারিত লিখুন";return}let{error}=await sb.from("news").insert(row);saveMsg.textContent=error?error.message:"খবর সফলভাবে সংরক্ষিত হয়েছে।";if(!error){title.value=content.value=upazila.value=image.value="";published.checked=false;load()}}async function load(){let{data,error}=await sb.from("news").select("*").order("created_at",{ascending:false});list.innerHTML=error?esc(error.message):data.map(n=>`<div class="item"><b>${esc(n.title)}</b><small>${esc(n.category)} · ${n.published?"Published":"Draft"}</small></div>`).join("")||"কোনো খবর নেই।"}check();</script></html>
